<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; width: 300px; font: 14px/1.45 system-ui, "Segoe UI", sans-serif; color: #e6edf7; background: #060a13; }
    .wrap { padding: 16px; }
    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .head img { width: 36px; height: 36px; border-radius: 9px; }
    .head b { font-size: 18px; }
    .head b span { background: linear-gradient(100deg, #22d3ee, #a855f7); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .status { display: flex; align-items: center; gap: 8px; padding: 9px 11px; border-radius: 10px; background: #0d1424; border: 1px solid #1c2a45; font-size: 13px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #64739a; flex: none; }
    .on .dot { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .off .dot { background: #f59e0b; }
    button { all: unset; box-sizing: border-box; display: block; width: 100%; text-align: center; cursor: pointer; margin-top: 10px; padding: 11px; border-radius: 12px; font-weight: 700; }
    .main { background: linear-gradient(100deg, #22d3ee, #6366f1 60%, #a855f7); color: #04121a; }
    .row { display: flex; gap: 8px; }
    .row button { background: #0d1424; border: 1px solid #1c2a45; color: #e6edf7; font-weight: 600; font-size: 13px; }
    .row button:hover { border-color: #22d3ee; }
    label { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13px; color: #8394b4; cursor: pointer; }
    .msg { min-height: 18px; margin-top: 10px; font-size: 12.5px; color: #8394b4; }
    a { color: #22d3ee; text-decoration: none; }
    .foot { margin-top: 10px; font-size: 12px; color: #64739a; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head"><img src="icons/icon48.png" alt=""><b>Nex<span>Grab</span></b></div>
    <div class="status" id="status"><i class="dot"></i><span id="statusText">PC app check ho rahi hai…</span></div>
    <button class="main" id="grab">Is page ki video download karein</button>
    <div class="row">
      <button id="best">Best quality</button>
      <button id="mp3">Sirf MP3</button>
    </div>
    <label><input type="checkbox" id="overlay" checked> Videos par NexGrab button dikhayein</label>
    <div class="msg" id="msg"></div>
    <div class="foot">App nahi hai? <a href="https://nexgrab.github.io/#apps" target="_blank">Download karein</a></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
